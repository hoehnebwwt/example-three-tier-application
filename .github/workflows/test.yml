name: Test

on:
  push:
    branches:
      - main
      - forge/**
  pull_request:
    branches:
      - main

jobs:
  # ── Test Web Application ─────────────────────────────────────────────────────

  test-web:
    name: Test Web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # ── Test API ─────────────────────────────────────────────────────────────────

  test-api:
    name: Test API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/api/package-lock.json

      - name: Install dependencies
        run: npm ci
